name: learnsynth_offline_llm
description: Offline LLM bridge for LearnSynth
version: 0.0.1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  path_provider: ^2.1.3
  path: ^1.9.0
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.learnsynth.learnsynth_offline_llm
        pluginClass: LearnsynthOfflineLlmPlugin
      web:
        pluginClass: LearnsynthOfflineLlmWeb
        fileName: learnsynth_offline_llm_web.dart
 
