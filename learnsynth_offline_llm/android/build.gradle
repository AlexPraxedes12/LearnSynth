plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace "com.learnsynth.learnsynth_offline_llm"
    compileSdkVersion 34
    ndkVersion "27.0.12077973"

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 34

        // ✅ En library va aquí (no al nivel de android{})
        consumerProguardFiles 'consumer-rules.pro'

        // Solo arm64 para evitar builds innecesarios
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            // El minify lo decide la app consumidora; aquí normalmente false
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }

    packagingOptions {
        resources {
            // evita choques de licencias o metadatos
            excludes += ["META-INF/*"]
        }
    }
}

dependencies {
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
  // Si falta:
  debugImplementation "io.flutter:flutter_embedding_debug:1.0.0" // Codex: sólo si el proyecto lo requiere en debug
}
